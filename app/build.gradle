plugins { id 'com.android.application' }

def signingFile = System.getenv('KEYSTORE_FILE')
def hasReleaseKey = signingFile != null && !signingFile.isBlank()
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    // Keep the original Java namespace to make this update non-destructive.
    namespace 'com.snapclean.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.threee.snap'
        minSdk 24
        targetSdk 35
        versionCode 23000 + buildNumber
        versionName '2.3.0'
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(signingFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The bundled Python / FFmpeg executables require extracted native libraries.
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}

// Kotlin 1.8+ folds the old JDK7/JDK8 stdlib classes into kotlin-stdlib.
// Some download-engine transitive dependencies still pull the 1.7.22 artifacts,
// whose classes duplicate kotlin-stdlib 1.8.22 at dex/Java compilation time.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
}
