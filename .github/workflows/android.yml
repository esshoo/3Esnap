name: Build 3Esnap APK

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node.js for UI logic tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural, Java policy, and JavaScript tests
        run: |
          python3 tools/check_project.py
          bash tools/check-java.sh
          node --test tests/web.test.cjs
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: UI interaction tests (mock Android bridge)
        run: python3 tests/ui_smoke.py
      - name: Set up Gradle and validate the original wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew
      # Debug keys are NOT production keys. The cache improves update compatibility,
      # but can be evicted. Use the documented signing secrets for a permanent identity.
      - name: Reuse development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: 3esnap-debug-keystore-${{ runner.os }}-v1
      - name: Create development key when absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=3Esnap,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Android unit tests, lint, and installable debug APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare optional release signing key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No release key configured: debug APKs will still be available."
            exit 0
          fi
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/3esnap-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/3esnap-release.jks" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release APKs
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Collect APKs and checksums
        run: python3 tools/package_apks.py
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done < <(find dist -type f -name '*.apk' -print0)
      - name: Downloadable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: 3Esnap-debug-APK-${{ github.run_number }}
          path: dist/debug/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Downloadable signed release APKs
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 3Esnap-signed-APK-${{ github.run_number }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3Esnap-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            .test-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary release key
        if: always()
        run: rm -f "$RUNNER_TEMP/3esnap-release.jks"

  # Tag publishing is deliberately separate from PR / ordinary push builds.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 3Esnap-signed-APK-${{ github.run_number }}
          path: release-apks
      - name: Publish APKs on the version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "3Esnap $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-apks/* --clobber
